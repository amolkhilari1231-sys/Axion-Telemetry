version: '3.8'

services:
  nextops-dashboard:
    image: nextops-dashboard:latest
    container_name: nextops-dashboard
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
