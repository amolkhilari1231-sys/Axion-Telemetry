version: '3.8'

services:
  ingestion-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nextops-ingestion-service:latest
    container_name: nextops-ingestion-service
    restart: always
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
