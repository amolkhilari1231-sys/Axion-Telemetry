name: "🗄️ Database Deployment & Migrations"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Cloud Environment"
        required: true
        type: choice
        options:
          - "Preprod"
          - "Production"
        default: "Preprod"
      action:
        description: "Migration Action"
        required: true
        type: choice
        options:
          - "apply"
          - "validate"
          - "rollback"
        default: "apply"
  push:
    branches:
      - main
    paths:
      - "*.sql"
      - "migrate.py"
      - ".github/workflows/deployment.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy-database:
    name: "🗄️ Database ${{ github.event.inputs.action || 'apply' }} (${{ github.event.inputs.environment || 'Preprod' }})"
    environment: ${{ github.event.inputs.environment || 'Preprod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: pip install psycopg2-binary requests

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Execute Database Deployment
        run: |
          ENV="${{ github.event.inputs.environment || 'Preprod' }}"
          ACTION="${{ github.event.inputs.action || 'apply' }}"
          chmod +x deploy.sh
          ./deploy.sh "$ENV" "$ACTION"
